<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PHK Hot Deals - Offline</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #f8fafc;
      }
      .container {
        text-align: center;
        padding: 2rem;
        max-width: 400px;
      }
      .logo {
        font-size: 2rem;
        font-weight: bold;
        color: #e74c3c;
        margin-bottom: 1rem;
      }
      h1 {
        color: #1e293b;
        margin-bottom: 0.5rem;
      }
      p {
        color: #64748b;
        margin-bottom: 1.5rem;
      }
      button {
        background: #e74c3c;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.375rem;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #c0392b;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">PHK Hot Deals</div>
      <h1>You're Offline</h1>
      <p>Please check your internet connection and try again.</p>
      <button onclick="window.location.reload()">Retry</button>
    </div>
  </body>
</html>
